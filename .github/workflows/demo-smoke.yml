name: Demo smoke checks

on:
  push:
    branches:
      - feature/demo-complete-users-vessels-20261013
  pull_request:
    paths:
      - "modules/**"
      - "tests/**"
      - ".github/workflows/demo-smoke.yml"

permissions:
  contents: read

jobs:
  static-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and model tests
        run: |
          node --check modules/shared/app.js
          node --check modules/platform/platform.js
          node --check modules/tenant/tenant.js
          node --check modules/tenant/vessel.js
          node tests/demo-foundation.test.cjs
          node tests/vessel-lifecycle.test.cjs
          node tests/user-assignments.test.cjs

  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser walkthrough and theme checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mp-demo-http.log 2>&1 &
          node tests/browser-demo.test.cjs
