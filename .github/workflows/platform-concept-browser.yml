name: Central Platform concept browser smoke
on:
  push:
    branches: [preview]
  pull_request:
    paths:
      - 'modules/platform/contract-demo/**'
      - '.github/workflows/platform-concept-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve static prototype
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/monitoring-concept-http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/modules/platform/contract-demo/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser scenarios
        run: npx playwright test modules/platform/contract-demo/tests/browser.spec.cjs preview/preview.spec.cjs preview/visual.spec.cjs --reporter=line
      - name: Check third-party live preview proxy (informational)
        continue-on-error: true
        run: |
          curl --location --show-error --max-time 25 --output /tmp/preview-public.html --write-out 'HTTP: %{http_code} content_type: %{content_type} bytes: %{size_download}\\n' 'https://raw.githack.com/eznzz/ui-monitoring-project/preview/preview/index.html'
          grep -q 'Monitoring Project — UI Preview' /tmp/preview-public.html
      - name: Verify commit-pinned browser preview
        run: |
          curl --fail --location --show-error --retry 6 --retry-delay 2 --retry-all-errors --max-time 25 \
            --output /tmp/preview-pinned.html \
            "https://raw.githack.com/eznzz/ui-monitoring-project/${GITHUB_SHA}/preview/index.html"
          grep -q 'mp-dashboard-tile' /tmp/preview-pinned.html
          echo "Verified commit preview: https://raw.githack.com/eznzz/ui-monitoring-project/${GITHUB_SHA}/preview/index.html"
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-design-review
          path: test-results/visual-*.png
          if-no-files-found: warn
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concept-browser-failure
          path: test-results/

      - name: Stage static site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        run: |
          mkdir -p _site
          cp -R preview modules components tokens _site/
          cp index.html style.css script.js mobile.css _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <meta http-equiv="refresh" content="0;url=./preview/">
          <title>Monitoring Project — Preview</title></head>
          <body><p>Перейти к <a href="./preview/">Monitoring Project Preview</a>.</p></body>
          </html>
          HTML
          test -f _site/preview/index.html
          test -f _site/modules/platform/contract-demo/index.html
          test -f _site/tokens/tokens.css
          test -f _site/style.css
      - name: Package GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    needs: browser-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
