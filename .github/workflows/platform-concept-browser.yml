name: VDMS frontend preview
on:
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vdms-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build upstream frontend
        run: |
          cd frontend/central-workspace
          npm ci
          VITE_C01_P4_LAB_UI=1 VITE_PLATFORM_MAIL_ADMIN_UI=0 VITE_C01_RESTRICTED_REVIEW_APPROVAL=1 npm run build
          cd ../tenant-console
          npm install --no-package-lock
          npm run build
      - name: Stage Pages
        run: |
          mkdir -p _site
          cp -R preview modules components tokens _site/
          cp style.css script.js mobile.css _site/
          cp -R frontend/central-workspace/dist _site/preview/central
          cp -R frontend/tenant-console/dist _site/preview/tenant
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=./preview/"><a href="./preview/">Preview</a>' > _site/index.html
          touch _site/.nojekyll
      - name: Browser smoke
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/preview/central/ && break; sleep 1; done
          npx playwright test preview/ported.spec.cjs --reporter=line
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
